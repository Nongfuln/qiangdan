<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>抢单平台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
      :root {
        --bg: #f3f3f1;
        --surface: #ffffff;
        --surface-2: #ececea;
        --ink: #191917;
        --ink-2: #5c5c57;
        --ink-3: #8f8f89;
        --line: #e2e2de;
        --accent: #d93a1e;
        --accent-ink: #ffffff;
        --accent-soft: #fdeee9;
        --green: #1d7a3f;
        --green-soft: #e6f4ea;
        --amber: #9a6a00;
        --amber-soft: #fdf3d7;
        --gray-soft: #eeeeec;
        --danger: #b3261e;
        --shadow: 0 1px 2px rgba(20, 20, 18, .05), 0 4px 14px rgba(20, 20, 18, .05);
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131312;
          --surface: #1e1e1c;
          --surface-2: #2a2a27;
          --ink: #f2f1ec;
          --ink-2: #b3b2ab;
          --ink-3: #7e7d77;
          --line: #33332f;
          --accent: #ff5c39;
          --accent-ink: #1c0d08;
          --accent-soft: #3a1d14;
          --green: #5cc47e;
          --green-soft: #173324;
          --amber: #e3b341;
          --amber-soft: #38300f;
          --gray-soft: #2a2a27;
          --danger: #ff7a6e;
          --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        padding-bottom: env(safe-area-inset-bottom);
      }
      button, input, textarea, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button, [role="button"], input, textarea, select { min-height: 2.75rem; }
      .wrap { max-width: 680px; margin: 0 auto; padding: 0 14px 40px; }

      /* ---------- top bar ---------- */
      .topbar {
        position: sticky; top: 0; z-index: 40;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .topbar-in { max-width: 680px; margin: 0 auto; padding: 10px 14px 0; }
      .idrow { display: flex; align-items: center; gap: 8px; padding-bottom: 10px; }
      .idrow .who { font-size: 14px; color: var(--ink-2); }
      .idrow .who b { color: var(--ink); font-size: 15px; }
      .idrow .spacer { flex: 1; }
      .live-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); }
      .live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .live-dot i { animation: none; } }
      .btn-ghost {
        border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
        border-radius: 999px; padding: 0 14px; min-height: 2.25rem; font-size: 13px;
      }
      .tabs { display: flex; gap: 4px; }
      .tab {
        flex: 1; border: 0; background: transparent; color: var(--ink-2);
        font-size: 16px; font-weight: 600; padding: 10px 4px 12px; min-height: 2.75rem;
        border-bottom: 3px solid transparent; position: relative;
      }
      .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
      .tab .badge {
        display: inline-block; min-width: 19px; padding: 0 5px; margin-left: 4px;
        background: var(--accent); color: var(--accent-ink); border-radius: 999px;
        font-size: 11px; font-weight: 700; line-height: 19px; vertical-align: 2px;
      }

      /* ---------- task cards ---------- */
      .list { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
      .card {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
        box-shadow: var(--shadow); padding: 16px;
      }
      .card-top { display: flex; gap: 12px; align-items: flex-start; }
      .card-title { font-size: 18px; font-weight: 700; line-height: 1.35; margin: 0; flex: 1; word-break: break-word; }
      .reward { text-align: right; flex-shrink: 0; }
      .reward .amt { font-size: 24px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
      .reward .per { font-size: 12px; color: var(--ink-3); }
      .desc { color: var(--ink-2); font-size: 14px; margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; }
      .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
      .meta b { color: var(--ink); font-weight: 600; }
      .meta .overdue { color: var(--danger); font-weight: 600; }
      .slots { margin-top: 12px; }
      .slots-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
      .slots-row b { color: var(--ink); font-variant-numeric: tabular-nums; }
      .bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
      .bar.full i { background: var(--ink-3); }
      .card-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
      .chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; line-height: 1.5; }
      .chip-open { background: var(--accent-soft); color: var(--accent); }
      .chip-done { background: var(--green-soft); color: var(--green); }
      .chip-closed { background: var(--gray-soft); color: var(--ink-2); }
      .chip-wait { background: var(--amber-soft); color: var(--amber); }
      .tag-offline { font-size: 12px; color: var(--ink-3); border: 1px dashed var(--line); padding: 2px 8px; border-radius: 999px; }
      .prem-badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); line-height: 1.5; white-space: nowrap; }
      .export-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
      .card-foot .spacer { flex: 1; }
      .btn {
        border: 0; border-radius: 10px; padding: 0 20px; font-weight: 700; font-size: 15px;
        background: var(--accent); color: var(--accent-ink); min-height: 2.75rem;
      }
      .btn:active { transform: scale(.98); }
      .btn:disabled { background: var(--surface-2); color: var(--ink-3); cursor: not-allowed; transform: none; }
      .btn-secondary { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
      .btn-green { background: var(--green); color: #fff; }
      @media (prefers-color-scheme: dark) { .btn-green { color: #0c1a10; } }
      .btn-sm { min-height: 2.5rem; padding: 0 14px; font-size: 14px; border-radius: 9px; }
      .grab-btn { min-width: 110px; }

      .claimants { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
      .claimants h4 { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
      .claimant { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 14px; }
      .claimant .avatar {
        width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
        display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0;
      }
      .claimant .nm { flex: 1; font-weight: 600; word-break: break-all; }
      .claimant .tm { font-size: 12px; color: var(--ink-3); }
      .none-note { font-size: 13px; color: var(--ink-3); padding: 4px 0; }
      .actions-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

      /* ---------- empty / states ---------- */
      .empty {
        text-align: center; padding: 56px 24px; background: var(--surface);
        border: 1px dashed var(--line); border-radius: var(--radius); margin-top: 14px;
      }
      .empty .big { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
      .empty p { color: var(--ink-2); margin: 0 0 18px; font-size: 14px; }
      .state-msg { text-align: center; color: var(--ink-2); padding: 48px 16px; font-size: 15px; }
      .state-msg.err { color: var(--danger); }
      .section-head { font-size: 15px; font-weight: 700; margin: 22px 0 4px; color: var(--ink); }
      .section-head:first-child { margin-top: 16px; }

      /* ---------- form ---------- */
      .form-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 16px; margin-top: 14px; }
      .field { margin-bottom: 16px; }
      .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 7px; }
      .field label .opt { color: var(--ink-3); font-weight: 400; font-size: 12px; }
      .field input, .field textarea {
        width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
        padding: 10px 12px; outline: none;
      }
      .field textarea { min-height: 96px; resize: vertical; }
      .field input:focus, .field textarea:focus { border-color: var(--accent); }
      .field .hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .money-input { position: relative; }
      .money-input span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--accent); font-weight: 800; }
      .money-input input { padding-left: 30px; font-variant-numeric: tabular-nums; }
      .submit-btn { width: 100%; font-size: 16px; }
      .form-note { text-align: center; font-size: 13px; color: var(--ink-3); margin-top: 12px; }

      /* ---------- modal / toast ---------- */
      .overlay {
        position: fixed; inset: 0; background: rgba(10,10,8,.55); z-index: 100;
        display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      .overlay[hidden] { display: none; }
      .modal { background: var(--surface); border-radius: 16px; padding: 24px 20px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
      .modal h2 { margin: 0 0 6px; font-size: 20px; }
      .modal p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
      .modal input { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; outline: none; margin-bottom: 14px; }
      .modal input:focus { border-color: var(--accent); }
      .modal .row { display: flex; gap: 10px; }
      .modal .row .btn { flex: 1; }
      #toast {
        position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-size: 15px; font-weight: 600;
        opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 200;
        max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.25);
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #toast.err { background: var(--danger); color: #fff; }
      #toast.ok { background: var(--green); color: #fff; }
      @media (prefers-color-scheme: dark) { #toast.ok { color: #0c1a10; } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-in">
        <div class="idrow">
          <span class="who">我是 <b id="myNameLabel">…</b></span>
          <span class="prem-badge" id="premBadge" hidden>高级账户</span>
          <button class="btn-ghost" id="renameBtn" type="button">改名</button>
          <span class="spacer"></span>
          <span class="live-dot"><i></i>实时同步</span>
        </div>
        <nav class="tabs" role="tablist" aria-label="主导航">
          <button class="tab" role="tab" id="tab-hall" aria-selected="true" data-view="hall" type="button">任务大厅</button>
          <button class="tab" role="tab" id="tab-publish" aria-selected="false" data-view="publish" type="button">发布任务</button>
          <button class="tab" role="tab" id="tab-mine" aria-selected="false" data-view="mine" type="button">我的任务<span class="badge" id="mineBadge" hidden>0</span></button>
        </nav>
      </div>
    </header>

    <main class="wrap">
      <!-- 任务大厅 -->
      <section id="view-hall" role="tabpanel" aria-labelledby="tab-hall">
        <div class="export-bar" id="exportBar" hidden>
          <button class="btn btn-secondary btn-sm" id="exportTasksBtn" type="button">导出任务清单 CSV</button>
          <button class="btn btn-secondary btn-sm" id="exportClaimsBtn" type="button">导出抢单记录 CSV</button>
        </div>
        <div id="hallState" class="state-msg">正在加载任务…</div>
        <div id="hallList" class="list"></div>
        <div id="hallEmpty" class="empty" hidden>
          <p class="big">大厅还空着</p>
          <p id="hallEmptyText">还没有人发布任务。发布第一条任务，圈里人马上就能抢单。</p>
          <button class="btn" id="goPublishBtn" type="button">去发布第一条任务</button>
        </div>
      </section>

      <!-- 发布任务 -->
      <section id="view-publish" role="tabpanel" aria-labelledby="tab-publish" hidden>
        <form class="form-card" id="publishForm" novalidate>
          <div class="field">
            <label for="fTitle">任务标题</label>
            <input id="fTitle" type="text" maxlength="60" placeholder="例如：帮忙搬一箱书到 3 楼" autocomplete="off" />
          </div>
          <div class="field">
            <label for="fDesc">任务说明 <span class="opt">（可选）</span></label>
            <textarea id="fDesc" maxlength="500" placeholder="写清楚要做什么、在哪里、有什么要求…"></textarea>
          </div>
          <div class="two-col">
            <div class="field">
              <label for="fReward">报酬（元）</label>
              <div class="money-input"><span>¥</span><input id="fReward" type="number" min="0" step="0.01" inputmode="decimal" placeholder="50" /></div>
              <div class="hint">每人拿这个数，线下结算</div>
            </div>
            <div class="field">
              <label for="fSlots">需要几个人</label>
              <input id="fSlots" type="number" min="1" max="99" step="1" inputmode="numeric" value="1" />
            </div>
          </div>
          <div class="field">
            <label for="fDeadline">截止时间 <span class="opt">（可选）</span></label>
            <input id="fDeadline" type="datetime-local" />
          </div>
          <div class="field">
            <label for="fPublisher">发布人</label>
            <input id="fPublisher" type="text" maxlength="20" autocomplete="off" />
          </div>
          <button class="btn submit-btn" id="publishBtn" type="submit">发布任务</button>
          <p class="form-note">发布后圈里所有人都能看到并抢单，报酬线下结算。</p>
        </form>
      </section>

      <!-- 我的任务 -->
      <section id="view-mine" role="tabpanel" aria-labelledby="tab-mine" hidden>
        <h3 class="section-head">我发布的</h3>
        <div id="myPubList" class="list"></div>
        <div id="myPubEmpty" class="empty" hidden>
          <p class="big">还没发布过任务</p>
          <p id="myPubEmptyText">有活儿想找人干？发一条任务，让大家来抢。</p>
          <button class="btn" id="goPublishBtn2" type="button">去发布任务</button>
        </div>
        <h3 class="section-head">我抢到的</h3>
        <div id="myClaimList" class="list"></div>
        <div id="myClaimEmpty" class="empty" hidden>
          <p class="big">还没抢到任务</p>
          <p>去任务大厅看看，手快有、手慢无。</p>
          <button class="btn" id="goHallBtn" type="button">去大厅抢单</button>
        </div>
      </section>
    </main>

    <!-- 首次填名 / 改名 -->
    <div class="overlay" id="nameOverlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
        <h2 id="nameTitle">先告诉大家你叫什么</h2>
        <p>不用注册登录，名字就是你的身份。圈里人靠这个名字认人、线下结账，填个大家都认识的称呼就行。</p>
        <input id="nameInput" type="text" maxlength="20" placeholder="例如：老王" autocomplete="off" />
        <div class="row">
          <button class="btn btn-secondary" id="nameCancelBtn" type="button" hidden>取消</button>
          <button class="btn" id="nameSaveBtn" type="button">就用这个名字</button>
        </div>
      </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="overlay" id="confirmOverlay" hidden>
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
        <h2 id="confirmTitle">确认</h2>
        <p id="confirmText"></p>
        <div class="row">
          <button class="btn btn-secondary" id="confirmCancelBtn" type="button">再想想</button>
          <button class="btn" id="confirmOkBtn" type="button">确定</button>
        </div>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        'use strict';

        var SUPABASE_URL = 'https://eaxxxqpaudawzanybxlb.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVheHh4cXBhdWRhd3phbnlieGxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MjE2MjMsImV4cCI6MjExMTA5NzYyM30.jdY59ntZsvew-xAHGB_oLH0QRWLqca7pJPHVIN0VbGs';
        var NAME_KEY = 'qiangdan_name';
        var REFRESH_MS = 8000;

        var sb = null;
        var loadError = null;
        try {
          if (!window.supabase) throw new Error('组件加载失败');
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
          loadError = e;
        }

        var myName = '';
        try { myName = (localStorage.getItem(NAME_KEY) || '').trim(); } catch (e) { myName = ''; }

        var PREMIUM_NAMES = ['阎鲲', '任帅民', '何荣臻'];
        function isPremium() { return PREMIUM_NAMES.indexOf(myName) >= 0; }

        var tasks = [];
        var claims = [];
        var currentView = 'hall';
        var busyIds = {}; // 正在提交中的任务 id，避免重复点

        /* ---------- helpers ---------- */
        function $(id) { return document.getElementById(id); }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function fmtMoney(v) {
          var n = Number(v);
          if (isNaN(n)) return '0';
          return (Math.round(n * 100) / 100).toString().replace(/\.0+$/, '').replace(/(\.\d)0$/, '$1');
        }
        function fmtTime(ts) {
          if (!ts) return '';
          var d = new Date(ts);
          if (isNaN(d.getTime())) return '';
          var now = new Date();
          var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
          var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
          if (sameDay) return '今天 ' + hh + ':' + mm;
          return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm;
        }
        function isOverdue(t) {
          return t.deadline && new Date(t.deadline).getTime() < Date.now() && t.status === 'open';
        }
        var toastTimer = null;
        function toast(msg, kind) {
          var el = $('toast');
          el.textContent = msg;
          el.className = 'show' + (kind ? ' ' + kind : '');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { el.className = ''; }, 3200);
        }

        var confirmCb = null;
        function askConfirm(title, text, okLabel, cb) {
          $('confirmTitle').textContent = title;
          $('confirmText').textContent = text;
          $('confirmOkBtn').textContent = okLabel || '确定';
          confirmCb = cb;
          $('confirmOverlay').hidden = false;
        }
        $('confirmCancelBtn').addEventListener('click', function () { $('confirmOverlay').hidden = true; confirmCb = null; });
        $('confirmOkBtn').addEventListener('click', function () {
          $('confirmOverlay').hidden = true;
          var cb = confirmCb; confirmCb = null;
          if (cb) cb();
        });

        /* ---------- name ---------- */
        function renderName() {
          $('myNameLabel').textContent = myName || '未填名';
          var prem = isPremium();
          $('premBadge').hidden = !prem;
          $('tab-publish').hidden = !prem;
          $('exportBar').hidden = !prem;
          $('goPublishBtn').hidden = !prem;
          $('goPublishBtn2').hidden = !prem;
          $('hallEmptyText').textContent = prem
            ? '还没有人发布任务。发布第一条任务，圈里人马上就能抢单。'
            : '还没有人发布任务，等高级账户发布后就能在这里抢单。';
          $('myPubEmptyText').textContent = prem
            ? '有活儿想找人干？发一条任务，让大家来抢。'
            : '只有高级账户能发布任务，你可以在大厅里抢单。';
          if (currentView === 'publish' && !prem) switchView('hall');
          if (currentView === 'publish') $('fPublisher').value = myName;
        }
        function openNameModal(canCancel) {
          $('nameInput').value = canCancel ? myName : '';
          $('nameCancelBtn').hidden = !canCancel;
          $('nameTitle').textContent = canCancel ? '换个名字' : '先告诉大家你叫什么';
          $('nameSaveBtn').textContent = canCancel ? '保存' : '就用这个名字';
          $('nameOverlay').hidden = false;
          setTimeout(function () { $('nameInput').focus(); }, 60);
        }
        function saveName() {
          var v = $('nameInput').value.trim();
          if (!v) { toast('先填个名字吧', 'err'); return; }
          myName = v;
          try { localStorage.setItem(NAME_KEY, v); } catch (e) {}
          $('nameOverlay').hidden = true;
          renderName();
          renderAll();
          toast(isPremium() ? '好，' + v + '，你已是高级账户' : '好，' + v + '，开始抢单吧', 'ok');
        }
        $('nameSaveBtn').addEventListener('click', saveName);
        $('nameInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') saveName(); });
        $('nameCancelBtn').addEventListener('click', function () { $('nameOverlay').hidden = true; });
        $('renameBtn').addEventListener('click', function () { openNameModal(true); });

        /* ---------- data ---------- */
        function claimsOf(taskId) {
          return claims.filter(function (c) { return c.task_id === taskId; });
        }
        function myClaimOf(taskId) {
          var list = claimsOf(taskId);
          for (var i = 0; i < list.length; i++) if (list[i].name === myName) return list[i];
          return null;
        }
        function isClaimDone(c) { return c && (c.status === 'done' || c.status === 'completed'); }

        var firstLoadDone = false;
        function loadData(silent) {
          if (!sb) {
            if (!silent) { $('hallState').textContent = '连接后台失败，请检查网络后刷新页面。'; $('hallState').className = 'state-msg err'; }
            return Promise.resolve();
          }
          return Promise.all([
            sb.from('tasks').select('*').order('created_at', { ascending: false }),
            sb.from('claims').select('*').order('created_at', { ascending: true })
          ]).then(function (res) {
            var tRes = res[0], cRes = res[1];
            if (tRes.error) throw tRes.error;
            if (cRes.error) throw cRes.error;
            tasks = tRes.data || [];
            claims = cRes.data || [];
            firstLoadDone = true;
            renderAll();
          }).catch(function (e) {
            if (!firstLoadDone && !silent) {
              $('hallState').textContent = '加载失败：' + (e.message || '网络异常') + '，请刷新重试。';
              $('hallState').className = 'state-msg err';
            }
          });
        }

        /* ---------- rendering ---------- */
        function statusChip(t, taken) {
          if (t.status === 'completed') return '<span class="chip chip-done">已完成</span>';
          if (t.status === 'closed') return '<span class="chip chip-closed">已关闭</span>';
          if (taken >= Number(t.slots)) return '<span class="chip chip-closed">名额已满</span>';
          return '<span class="chip chip-open">抢单中</span>';
        }
        function taskMeta(t) {
          var html = '<span>发布人 <b>' + esc(t.publisher) + '</b></span>';
          if (t.deadline) {
            html += '<span>截止 ' + (isOverdue(t) ? '<span class="overdue">' + esc(fmtTime(t.deadline)) + '（已过期）</span>' : '<b>' + esc(fmtTime(t.deadline)) + '</b>') + '</span>';
          } else {
            html += '<span>截止 <b>不限</b></span>';
          }
          return html;
        }
        function slotsBlock(t, taken) {
          var total = Math.max(Number(t.slots) || 0, 0);
          var pct = total > 0 ? Math.min(100, Math.round(taken / total * 100)) : 0;
          return '<div class="slots"><div class="slots-row"><span>已抢 <b>' + taken + '</b> / ' + total + ' 人</span>' +
            '<span>' + (taken >= total ? '名额已抢完' : '还剩 ' + (total - taken) + ' 个名额') + '</span></div>' +
            '<div class="bar' + (taken >= total ? ' full' : '') + '"><i style="width:' + pct + '%"></i></div></div>';
        }
        function claimantsBlock(t) {
          var cs = claimsOf(t.id);
          if (cs.length === 0) {
            return '<div class="claimants"><h4>抢单的人</h4><div class="none-note">还没有人抢这个任务</div></div>';
          }
          return '<div class="claimants"><h4>抢单的人（' + cs.length + '）</h4>' + cs.map(function (c) {
            var st = isClaimDone(c)
              ? '<span class="chip chip-done">已做完</span>'
              : '<span class="chip chip-wait">进行中</span>';
            return '<div class="claimant"><span class="avatar">' + esc((c.name || '?').slice(0, 1)) + '</span>' +
              '<span class="nm">' + esc(c.name) + '</span><span class="tm">' + esc(fmtTime(c.created_at)) + '</span>' + st + '</div>';
          }).join('') + '</div>';
        }
        function canSeeClaimants(t) {
          // 高级账户看全部；任务发布人、抢到这个任务的人也能看到名单；其他人只看数字
          return isPremium() || t.publisher === myName || !!myClaimOf(t.id);
        }
        function cardHead(t) {
          return '<div class="card-top"><h3 class="card-title">' + esc(t.title) + '</h3>' +
            '<div class="reward"><div class="amt">¥' + esc(fmtMoney(t.reward)) + '</div><div class="per">每人</div></div></div>' +
            (t.description ? '<p class="desc">' + esc(t.description) + '</p>' : '') +
            '<div class="meta">' + taskMeta(t) + '</div>';
        }

        function renderHall() {
          var list = $('hallList');
          if (!firstLoadDone) return;
          $('hallState').hidden = tasks.length > 0;
          if (tasks.length === 0) { $('hallState').hidden = true; }
          $('hallEmpty').hidden = tasks.length !== 0;
          list.innerHTML = tasks.map(function (t) {
            var taken = claimsOf(t.id).length;
            var mine = t.publisher === myName;
            var myClaim = myClaimOf(t.id);
            var full = taken >= Number(t.slots);
            var btn;
            if (t.status === 'completed') btn = '<button class="btn grab-btn" disabled>已完成</button>';
            else if (t.status === 'closed') btn = '<button class="btn grab-btn" disabled>已关闭</button>';
            else if (mine) btn = '<button class="btn grab-btn" disabled>我发布的</button>';
            else if (myClaim) btn = '<button class="btn grab-btn" disabled>已抢到 ✓</button>';
            else if (full) btn = '<button class="btn grab-btn" disabled>名额已满</button>';
            else btn = '<button class="btn grab-btn" data-grab="' + esc(t.id) + '"' + (busyIds[t.id] ? ' disabled' : '') + '>' + (busyIds[t.id] ? '抢单中…' : '抢单') + '</button>';
            var who = canSeeClaimants(t) ? claimantsBlock(t) : '';
            return '<article class="card">' + cardHead(t) + slotsBlock(t, taken) +
              '<div class="card-foot">' + statusChip(t, taken) + '<span class="tag-offline">线下结算</span>' +
              '<span class="spacer"></span>' + btn + '</div>' + who + '</article>';
          }).join('');
        }

        function renderMine() {
          var pub = tasks.filter(function (t) { return t.publisher === myName; });
          var myClaims = claims.filter(function (c) { return c.name === myName; });
          var claimedTasks = myClaims.map(function (c) {
            var t = null;
            for (var i = 0; i < tasks.length; i++) if (tasks[i].id === c.task_id) t = tasks[i];
            return { claim: c, task: t };
          }).filter(function (x) { return x.task; });

          var badge = $('mineBadge');
          var activeCount = pub.filter(function (t) { return t.status === 'open'; }).length +
            claimedTasks.filter(function (x) { return x.task.status === 'open' && !isClaimDone(x.claim); }).length;
          badge.hidden = activeCount === 0;
          badge.textContent = activeCount;

          $('myPubEmpty').hidden = pub.length !== 0;
          $('myPubList').innerHTML = pub.map(function (t) {
            var cs = claimsOf(t.id);
            var claimantsHtml = claimantsBlock(t);
            var actions = '';
            if (t.status === 'open') {
              actions = '<div class="actions-row">' +
                '<button class="btn btn-green btn-sm" data-complete="' + esc(t.id) + '">确认完成</button>' +
                '<button class="btn btn-secondary btn-sm" data-close="' + esc(t.id) + '">关闭任务</button></div>';
            }
            return '<article class="card">' + cardHead(t) + slotsBlock(t, cs.length) +
              '<div class="card-foot">' + statusChip(t, cs.length) + '<span class="tag-offline">线下结算</span></div>' +
              claimantsHtml + actions + '</article>';
          }).join('');

          $('myClaimEmpty').hidden = claimedTasks.length !== 0;
          $('myClaimList').innerHTML = claimedTasks.map(function (x) {
            var t = x.task, c = x.claim;
            var taken = claimsOf(t.id).length;
            var foot;
            if (t.status === 'completed') {
              foot = '<span class="chip chip-done">已完成 · 等线下结账</span>';
            } else if (t.status === 'closed') {
              foot = '<span class="chip chip-closed">任务已关闭</span>';
            } else if (isClaimDone(c)) {
              foot = '<span class="chip chip-done">我已做完 · 等发布人确认</span>';
            } else {
              foot = '<span class="chip chip-wait">进行中</span><span class="spacer"></span>' +
                '<button class="btn btn-green btn-sm" data-done="' + esc(c.id) + '"' + (busyIds[c.id] ? ' disabled' : '') + '>标记已做完</button>';
            }
            return '<article class="card">' + cardHead(t) + slotsBlock(t, taken) +
              '<div class="card-foot">' + foot + '<span class="tag-offline">线下结算</span></div>' +
              claimantsBlock(t) + '</article>';
          }).join('');
        }

        function renderAll() {
          renderName();
          renderHall();
          renderMine();
        }

        /* ---------- actions ---------- */
        function grab(taskId) {
          if (!myName) { openNameModal(false); return; }
          var t = null;
          for (var i = 0; i < tasks.length; i++) if (tasks[i].id === taskId) t = tasks[i];
          if (t && t.publisher === myName) { toast('这是你发布的任务，不能抢自己的单', 'err'); return; }
          busyIds[taskId] = true; renderHall();
          sb.rpc('grab_task', { p_task_id: taskId, p_name: myName }).then(function (res) {
            busyIds[taskId] = false;
            if (res.error) { toast(res.error.message || '抢单失败，请重试', 'err'); renderHall(); return; }
            var data = res.data;
            if (Array.isArray(data)) data = data[0];
            if (data && data.ok) {
              toast('抢单成功！干完活点「我的任务」标记已做完', 'ok');
            } else if (data && data.error) {
              toast(data.error, 'err'); // 后台返回的失败原因，原样提示
            } else {
              toast('抢单失败，请重试', 'err');
            }
            loadData(true);
          }).catch(function (e) {
            busyIds[taskId] = false;
            toast('抢单失败：' + (e.message || '网络异常'), 'err');
            renderHall();
          });
        }

        function setTaskStatus(taskId, status, okMsg) {
          sb.from('tasks').update({ status: status }).eq('id', taskId).then(function (res) {
            if (res.error) { toast('操作失败：' + res.error.message, 'err'); return; }
            toast(okMsg, 'ok');
            loadData(true);
          });
        }
        function markClaimDone(claimId) {
          busyIds[claimId] = true; renderMine();
          sb.from('claims').update({ status: 'done' }).eq('id', claimId).then(function (res) {
            busyIds[claimId] = false;
            if (res.error) { toast('标记失败：' + res.error.message, 'err'); renderMine(); return; }
            toast('已标记做完，等发布人确认后线下结账', 'ok');
            loadData(true);
          });
        }

        document.addEventListener('click', function (e) {
          var g = e.target.closest('[data-grab]');
          if (g) { grab(g.getAttribute('data-grab')); return; }
          var cp = e.target.closest('[data-complete]');
          if (cp) {
            var id = cp.getAttribute('data-complete');
            askConfirm('确认完成？', '确认后任务变为「已完成」，请按约定线下把报酬结给干活的人。', '确认完成', function () { setTaskStatus(id, 'completed', '任务已完成，记得线下结账'); });
            return;
          }
          var cl = e.target.closest('[data-close]');
          if (cl) {
            var id2 = cl.getAttribute('data-close');
            askConfirm('关闭这个任务？', '关闭后没人能再抢单，已经抢了的人也会看到任务已关闭。', '关闭任务', function () { setTaskStatus(id2, 'closed', '任务已关闭'); });
            return;
          }
          var dn = e.target.closest('[data-done]');
          if (dn) { markClaimDone(dn.getAttribute('data-done')); return; }
        });

        /* ---------- export (高级账户) ---------- */
        function fmtDateTime(ts) {
          if (!ts) return '';
          var d = new Date(ts);
          if (isNaN(d.getTime())) return '';
          function p(n) { return ('0' + n).slice(-2); }
          return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }
        function taskStatusText(t, taken) {
          if (t.status === 'completed') return '已完成';
          if (t.status === 'closed') return '已关闭';
          if (taken >= Number(t.slots)) return '名额已满';
          return '抢单中';
        }
        function csvCell(v) {
          return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
        }
        function downloadCSV(filename, rows) {
          var csv = '\uFEFF' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
          var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }
        function dateStamp() {
          var d = new Date();
          function p(n) { return ('0' + n).slice(-2); }
          return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate());
        }
        function exportTasks() {
          if (!isPremium()) { toast('仅高级账户可导出', 'err'); return; }
          if (tasks.length === 0) { toast('暂无任务可导出', 'err'); return; }
          var rows = [['标题', '报酬（元）', '需要人数', '已抢人数', '发布人', '状态', '截止时间', '发布时间']];
          tasks.forEach(function (t) {
            var taken = claimsOf(t.id).length;
            rows.push([t.title, fmtMoney(t.reward), t.slots, taken, t.publisher, taskStatusText(t, taken), t.deadline ? fmtDateTime(t.deadline) : '不限', fmtDateTime(t.created_at)]);
          });
          downloadCSV('任务清单_' + dateStamp() + '.csv', rows);
          toast('任务清单已导出', 'ok');
        }
        function exportClaims() {
          if (!isPremium()) { toast('仅高级账户可导出', 'err'); return; }
          if (claims.length === 0) { toast('暂无抢单记录可导出', 'err'); return; }
          var rows = [['任务标题', '抢单人', '抢单时间', '状态']];
          claims.forEach(function (c) {
            var t = null;
            for (var i = 0; i < tasks.length; i++) if (tasks[i].id === c.task_id) t = tasks[i];
            rows.push([t ? t.title : '(任务不存在)', c.name, fmtDateTime(c.created_at), isClaimDone(c) ? '已做完' : '进行中']);
          });
          downloadCSV('抢单记录_' + dateStamp() + '.csv', rows);
          toast('抢单记录已导出', 'ok');
        }
        $('exportTasksBtn').addEventListener('click', exportTasks);
        $('exportClaimsBtn').addEventListener('click', exportClaims);

        /* ---------- publish ---------- */
        $('publishForm').addEventListener('submit', function (e) {
          e.preventDefault();
          if (!isPremium()) { toast('仅高级账户可发布任务', 'err'); return; }
          var title = $('fTitle').value.trim();
          var desc = $('fDesc').value.trim();
          var rewardRaw = $('fReward').value;
          var reward = parseFloat(rewardRaw);
          var slots = parseInt($('fSlots').value, 10);
          var deadlineVal = $('fDeadline').value;
          var publisher = $('fPublisher').value.trim();
          if (!title) { toast('先写个任务标题', 'err'); $('fTitle').focus(); return; }
          if (rewardRaw === '' || isNaN(reward) || reward < 0) { toast('报酬金额填得不对', 'err'); $('fReward').focus(); return; }
          if (isNaN(slots) || slots < 1) { toast('人数至少 1 个', 'err'); $('fSlots').focus(); return; }
          if (!publisher) { toast('发布人名字不能为空', 'err'); $('fPublisher').focus(); return; }
          if (publisher !== myName) {
            myName = publisher;
            try { localStorage.setItem(NAME_KEY, publisher); } catch (err) {}
            renderName();
          }
          var btn = $('publishBtn');
          btn.disabled = true; btn.textContent = '发布中…';
          sb.from('tasks').insert({
            title: title,
            description: desc || null,
            reward: reward,
            slots: slots,
            publisher: publisher,
            status: 'open',
            deadline: deadlineVal ? new Date(deadlineVal).toISOString() : null
          }).then(function (res) {
            btn.disabled = false; btn.textContent = '发布任务';
            if (res.error) { toast('发布失败：' + res.error.message, 'err'); return; }
            $('fTitle').value = ''; $('fDesc').value = ''; $('fReward').value = ''; $('fSlots').value = '1'; $('fDeadline').value = '';
            toast('发布成功！圈里人马上就能抢', 'ok');
            switchView('hall');
            loadData(true);
          });
        });

        /* ---------- tabs ---------- */
        function switchView(v) {
          if (v === 'publish' && !isPremium()) {
            toast('仅高级账户可发布任务', 'err');
            v = 'hall';
          }
          currentView = v;
          ['hall', 'publish', 'mine'].forEach(function (k) {
            $('view-' + k).hidden = k !== v;
            $('tab-' + k).setAttribute('aria-selected', k === v ? 'true' : 'false');
          });
          if (v === 'publish') $('fPublisher').value = myName;
          window.scrollTo(0, 0);
        }
        document.querySelectorAll('.tab').forEach(function (tab) {
          tab.addEventListener('click', function () { switchView(tab.getAttribute('data-view')); });
        });
        $('goPublishBtn').addEventListener('click', function () { switchView('publish'); });
        $('goPublishBtn2').addEventListener('click', function () { switchView('publish'); });
        $('goHallBtn').addEventListener('click', function () { switchView('hall'); });

        /* ---------- boot ---------- */
        renderName();
        if (loadError) {
          $('hallState').textContent = '组件加载失败，请检查网络后刷新页面。';
          $('hallState').className = 'state-msg err';
        } else {
          loadData(false);
          setInterval(function () { loadData(true); }, REFRESH_MS);
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) loadData(true);
          });
        }
        if (!myName) openNameModal(false);
      })();
    </script>
  </body>
</html>
